name: CI

# The point of this workflow is a cheap verdict on someone else's patch: does it
# build, vet clean, and pass the tests. It deliberately stays small — the heavy
# cross-platform work belongs to the release pipeline, and lint is advisory.
# Nothing here talks to a SAP system: live tests sit behind the `integration` tag.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Compile the integration-tagged tests too, so a live test cannot rot
      # unnoticed just because CI never runs it.
      - name: Vet (integration tag)
        run: go vet -tags integration ./...

      # ubuntu-latest ships gcc, so CGO_ENABLED defaults to 1 and the go-sqlite3
      # tests in cmd/vsp and pkg/cache actually run here. They are skipped on a
      # dev box without a C compiler, which makes this job the stricter gate.
      - name: Test
        run: go test ./...

      # Cross-compilation only guards main; a release already builds all nine
      # targets, and PRs do not need to pay for it.
      - name: Cross-compile check
        if: github.event_name == 'push'
        run: |
          for target in linux/amd64 linux/386 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... || exit 1
          done

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # Advisory: a linter release built against an older Go than this module's
    # directive fails before it reads a line of code, and that must not block a
    # contributor. Read the output, do not gate on it.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m
