name: Release

# Fork release line: v3.<U>.<P>, where U is the minor of the newest upstream
# release this build contains and P counts fork releases on top of it
# (see FORK.md, Release). The CHANGELOG section for the version is written
# by hand in the PR that prepares the release; this workflow only reads it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          Version to release (e.g. v3.58.0). Leave empty to derive it from the
          upstream release this build contains.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout — full history, for the tag lookups below
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 2. Abort the release if anything is red
      - name: Run tests
        run: go test ./...

      # 3. Determine the version
      #    Upstream's tags are fetched into refs/upstream-tags, never refs/tags,
      #    so neither git describe nor goreleaser can mistake them for ours.
      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.version }}"

          if [[ -n "$INPUT" ]]; then
            VERSION="v${INPUT#v}"
          else
            git fetch --no-tags https://github.com/oisee/vibing-steampunk.git \
              '+refs/tags/v2.*:refs/upstream-tags/v2.*'
            UPSTREAM=$(git for-each-ref --merged HEAD --sort=-version:refname --count=1 \
              --format='%(refname:lstrip=2)' refs/upstream-tags)
            if [[ -z "$UPSTREAM" ]]; then
              echo "::error::no upstream release tag is contained in HEAD"
              exit 1
            fi
            U=$(echo "${UPSTREAM#v}" | cut -d. -f2)

            LAST=$(git describe --tags --match 'v3.*' --abbrev=0 2>/dev/null || echo "v3.0.0")
            LAST_U=$(echo "${LAST#v}" | cut -d. -f2)
            LAST_P=$(echo "${LAST#v}" | cut -d. -f3 | cut -d- -f1)
            if [[ "$LAST_U" == "$U" ]]; then P=$((LAST_P + 1)); else P=0; fi

            VERSION="v3.${U}.${P}"
            echo "Contains upstream ${UPSTREAM}; last fork release ${LAST}"
          fi

          if [[ ! "$VERSION" =~ ^v3\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${VERSION} is not on the fork's v3.<U>.<P> line"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::${VERSION} is already tagged"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION}"

      # 4. Release notes: the version's own CHANGELOG section, verbatim.
      #    A release without one is refused rather than published empty.
      - name: Extract release notes
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          awk -v h="## [${V#v}]" '
            index($0, h) == 1 { on = 1; next }
            on && /^## \[/    { exit }
            on                { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "::error::CHANGELOG.md has no '## [${V#v}]' section — add it in the release PR (FORK.md, Release)"
            exit 1
          fi

      # 5. Tag and push the tag only — no bot commit on main
      - name: Tag and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      # 6. GoReleaser — builds all platform binaries, creates the GitHub release
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version }}
