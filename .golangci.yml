version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - bodyclose
    - misspell
    - noctx
    - prealloc
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      disable:
        - fieldalignment
      enable-all: true
    misspell:
      # SAP object type codes, not English words: CLAS (class), INTF, DDLS, ...
      # The type-code tables spell them in both cases on purpose.
      ignore-rules:
        - clas
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - unparam
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vibingsteamer/mcp-abap-adt-go
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
